services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripsync
      POSTGRES_PASSWORD: tripsync
      POSTGRES_DB: tripsync
    ports:
      - "5432:5432"
    volumes:
      - tripsync_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tripsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  tripsync_pgdata: